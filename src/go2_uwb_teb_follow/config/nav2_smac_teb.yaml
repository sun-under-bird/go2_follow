velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.45, 0.0, 1.0]
    min_velocity: [-0.20, 0.0, -1.0]
    max_accel: [0.4, 0.0, 1.2]
    max_decel: [-0.5, 0.0, -1.4]
    odom_topic: /odom_leg
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
