planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.40
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.20
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /odom_leg
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.06
      movement_time_allowance: 8.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35
      stateful: true

    FollowPath:
      plugin: "teb_local_planner/TEBLocalPlanner"
      odom_topic: /odom_leg
      map_frame: odom
      teb_autosize: true
      dt_ref: 0.30
      dt_hysteresis: 0.10
      max_global_plan_lookahead_dist: 3.0
      global_plan_overwrite_orientation: true
      allow_init_with_backwards_motion: false
      max_vel_x: 0.45
      max_vel_x_backwards: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.0
      acc_lim_x: 0.45
      acc_lim_y: 0.0
      acc_lim_theta: 1.2
      min_turning_radius: 0.0
      wheelbase: 0.0
      cmd_angle_instead_rotvel: false
      footprint_model:
        type: "line"
        line_start: [-0.35, 0.0]
        line_end: [0.35, 0.0]
      min_obstacle_dist: 0.2
      inflation_dist: 0.25
      include_costmap_obstacles: true
      costmap_obstacles_behind_robot_dist: 0.8
      obstacle_poses_affected: 15
      weight_max_vel_x: 2.0
      weight_max_vel_theta: 1.0
      weight_acc_lim_x: 1.0
      weight_acc_lim_theta: 1.0
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 100.0
      weight_optimaltime: 1.0
      weight_obstacle: 50.0
      weight_inflation: 0.1
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35
      free_goal_vel: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 0.2
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.0
      footprint: "[[0.35, 0.16], [0.35, -0.16], [-0.35, -0.16], [-0.35, 0.16]]"
      plugins: [stvl_layer, denoise_layer, inflation_layer]

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 1.5
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: obstacle ground
        obstacle:
          topic: /local_grid_obstacle
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_range: 3.0
          min_obstacle_height: 0.10
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: voxel
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 2.0
          min_z: 0.10
          vertical_fov_angle: 0.8745
          horizontal_fov_angle: 1.048
          decay_acceleration: 1.0
          model_type: 0
        ground:
          topic: /local_grid_ground
          data_type: PointCloud2
          marking: false
          clearing: true
          obstacle_range: 3.0
          min_obstacle_height: 0.0
          max_obstacle_height: 0.25
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: voxel
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 0.25
          min_z: 0.0
          vertical_fov_angle: 0.8745
          horizontal_fov_angle: 1.048
          decay_acceleration: 1.0
          model_type: 0

      denoise_layer:
        plugin: nav2_costmap_2d::DenoiseLayer
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        cost_scaling_factor: 5.0
        inflation_radius: 0.2

      always_send_full_costmap: false

