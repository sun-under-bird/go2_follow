uwb_target_seed_node:
  ros__parameters:
    one1000_topic: /uwb/target_point
    base_frame: base_footprint
    one1000_frame: base_footprint
    seed_target_topic: /stereo_vfh/seed_target
    seed_valid_topic: /stereo_vfh/seed_valid
    use_tf: true
    require_tf: true
    prefer_xy: true
    angle_in_degrees: false
    invert_y: false
    angle_offset_rad: 0.0
    anchor_x_offset: 0.0
    anchor_y_offset: 0.0

stereo_vfh_controller_node:
  ros__parameters:
    base_frame: base_footprint
    pointcloud_topic: /local_grid_obstacle
    seed_target_topic: /stereo_vfh/seed_target
    manual_target_topic: /stereo_vfh/manual_target
    enabled_topic: /stereo_vfh/enabled
    cmd_vel_topic: /cmd_vel
    target_topic: /stereo_vfh/target
    follow_goal_topic: /stereo_vfh/follow_goal
    status_topic: /stereo_vfh/status
    marker_topic: /stereo_vfh/markers
    enabled_default: true
    publish_rate_hz: 30.0
    max_points_per_cloud: 60000
    obstacle_x_min: -4.0
    obstacle_x_max: 4.0
    obstacle_y_abs: 4.0
    obstacle_z_min: 0.05
    obstacle_z_max: 1.2
    robot_frame_front: 0.15
    robot_frame_back: 0.35
    robot_frame_left: 0.15
    robot_frame_right: 0.15
    follow_distance: 1.00
    sector_angle_deg: 5.0
    vfh_range_min: 0.10
    vfh_range_max: 4.0
    robot_radius: 0.35
    safety_margin: 0.20
    hard_stop_distance: 0.35
    slowdown_distance: 0.80
    corridor_width: 0.75
    target_mask_radius: 0.35
    side_switch_hold_sec: 1.2
    corridor_clear_hold_sec: 0.8
    heading_limit_deg: 90.0
    target_heading_weight: 1.0
    last_heading_weight: 0.25
    wrong_side_penalty: 3.0
    valley_width_weight: 0.04
    max_vx: 0.45
    max_vy: 0.35
    max_vyaw: 0.8
    angular_scale: 1.0
    bypass_heading_blend: 0.55
    min_move_speed: 0.08
    linear_scale: 0.45
    publish_markers: true
    marker_radius: 1.2
