uwb_target_seed_node:
  ros__parameters:
    one1000_topic: /libAoa_robot_publisher
    base_frame: base_link
    one1000_frame: uwb_link
    seed_target_topic: /stereo_apf/seed_target
    seed_valid_topic: /stereo_apf/seed_valid
    use_tf: true
    require_tf: true
    disable_quality_gating: true
    confidence_threshold: 0.0
    target_timeout_sec: 3.0
    status_publish_period_sec: 0.5
    prefer_xy: true
    angle_in_degrees: false
    invert_y: false
    angle_offset_rad: 0.0
    anchor_x_offset: 0.0
    anchor_y_offset: 0.0
    min_target_distance: 0.15
    max_target_distance: 8.0

stereo_apf_controller_node:
  ros__parameters:
    base_frame: base_link
    pointcloud_topic: /local_grid_obstacle
    seed_target_topic: /stereo_apf/seed_target
    seed_valid_topic: /stereo_apf/seed_valid
    manual_target_topic: /stereo_apf/manual_target
    enabled_topic: /stereo_apf/enabled
    cmd_vel_topic: /cmd_vel_apf
    target_topic: /stereo_apf/target
    status_topic: /stereo_apf/status
    enabled_default: true
    publish_rate_hz: 30.0
    pointcloud_timeout_sec: 0.5
    seed_timeout_sec: 3.0
    target_hold_sec: 0.8
    seed_reset_distance: 1.0
    max_points_per_cloud: 60000
    obstacle_x_min: 0.05
    obstacle_x_max: 4.0
    obstacle_y_abs: 1.5
    obstacle_z_min: 0.05
    obstacle_z_max: 1.2
    robot_frame_front: 0.35
    robot_frame_back: 0.35
    robot_frame_left: 0.20
    robot_frame_right: 0.20
    target_radius: 0.30
    min_points_in_target: 3
    smoothing_alpha: 0.35
    apf_influence_dist: 1.2
    apf_repulse_gain: 0.08
    apf_max_repulse: 0.30
    apf_emergency_dist: 0.45
    apf_slowdown_dist: 1.0
    corridor_width: 0.70
    follow_distance: 2.0
    distance_deadband: 0.10
    lateral_deadband: 0.03
    yaw_deadband: 0.08
    linear_scale: 0.40
    lateral_scale: 0.60
    angular_scale: 1.0
    max_vx: 0.30
    max_vy: 0.20
    max_vyaw: 0.80
    max_reverse_vx: 0.0
    allow_reverse: false

apf_safety_mux_node:
  ros__parameters:
    base_frame: base_link
    cmd_vel_in: /cmd_vel_apf
    cmd_vel_out: /cmd_vel_safe
    pointcloud_topic: /local_grid_obstacle
    target_topic: /stereo_apf/target
    status_topic: /stereo_apf/safety_status
    publish_rate_hz: 30.0
    cmd_timeout_sec: 0.3
    target_timeout_sec: 0.5
    pointcloud_timeout_sec: 0.5
    emergency_x_max: 0.45
    obstacle_clear_x_max: 0.60
    slow_x_max: 1.0
    front_y_abs: 0.45
    obstacle_z_min: 0.05
    obstacle_z_max: 1.2
    robot_frame_front: 0.35
    robot_frame_back: 0.35
    robot_frame_left: 0.20
    robot_frame_right: 0.20
    max_points_per_cloud: 60000
    max_vx: 0.30
    max_vy: 0.20
    max_vyaw: 0.80
    max_reverse_vx: 0.0
    max_accel_vx: 0.6
    max_accel_vy: 0.8
    max_accel_vyaw: 1.5
