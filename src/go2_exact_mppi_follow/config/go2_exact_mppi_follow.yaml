go2_uwb_goal_bridge:
  ros__parameters:
    one1000_topic: /libAoa_robot_publisher
    goal_local_topic: /exact_mppi/goal_local
    status_topic: /exact_mppi/goal_status
    base_frame: base_link
    one1000_frame: base_link
    use_tf: true
    require_tf: true
    use_latest_tf: true
    transform_timeout_sec: 0.2
    require_valid_state: true
    prefer_xy: true
    angle_in_degrees: false
    invert_y: false
    angle_offset_rad: 0.0
    anchor_x_offset: 0.0
    anchor_y_offset: 0.0
    min_target_distance: 0.15
    max_target_distance: 8.0
    follow_distance: 0.9
    forward_goal_limit: 2.0
    reverse_goal_limit: 0.4
    goal_deadband: 0.03

go2_exact_mppi_node:
  ros__parameters:
    mppi_config_file: go2_orin_omni.yaml
    require_jax_gpu: true
    base_frame: base_link
    map_frame: odom
    pointcloud_topic: /stereo/points2
    odom_topic: /odom
    goal_local_topic: /exact_mppi/goal_local
    cmd_vel_topic: /cmd_vel
    cmd_vel_raw_topic: /exact_mppi/cmd_vel_raw
    filtered_points_topic: /exact_mppi/filtered_points
    status_topic: /exact_mppi/status
    cost_breakdown_topic: /exact_mppi/cost_breakdown
    plan_topic: /exact_mppi/plan
    control_frequency: 10.0
    goal_timeout_sec: 1.0
    cloud_timeout_sec: 0.5
    odom_timeout_sec: 0.5
    transform_timeout_sec: 0.2
    use_latest_tf: true
    max_raw_points: 60000
    emergency_stop_distance: 0.18
    publish_plan: true
    publish_cost_breakdown: true
    timing_log_every_n: 20
    cloud_x_min: -0.4
    cloud_x_max: 3.0
    cloud_y_abs: 1.8
    cloud_z_min: 0.05
    cloud_z_max: 1.0
    voxel_size: 0.08
    corridor_width: 0.9
