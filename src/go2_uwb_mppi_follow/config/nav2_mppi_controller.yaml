controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /odom_leg
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.06
      required_movement_angle: 0.35
      movement_time_allowance: 5.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      debug_trajectory_details: false
      visualize: false
      reset_period: 1.0
      model_dt: 0.05
      time_steps: 60
      batch_size: 2000
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      vx_max: 0.45
      vx_min: -0.20
      vy_max: 0.0
      wz_max: 1.0
      vx_std: 0.25
      vy_std: 0.0
      wz_std: 0.70
      retry_attempt_limit: 2
      motion_model: DiffDrive
      prune_distance: 3.0
      transform_tolerance: 0.2
      critics:
        [
          ConstraintCritic,
          ObstaclesCritic,
          GoalCritic,
          PathAlignCritic,
          PathFollowCritic,
          PathAngleCritic,
          PreferForwardCritic,
          TwirlingCritic,
          VelocityDeadbandCritic,
        ]

      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 4.0
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 1000000.0
        collision_margin_distance: 0.10
        near_goal_distance: 0.6
        inflation_radius: 0.45
        cost_scaling_factor: 4.0

      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      PathAlignCritic:
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        offset_from_furthest: 20
        trajectory_point_step: 4
        threshold_to_consider: 0.7
        use_path_orientations: false

      PathFollowCritic:
        threshold_to_consider: 1.4
        offset_from_furthest: 6
        cost_power: 1
        cost_weight: 5.0

      PathAngleCritic:
        offset_from_furthest: 4
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 0.7
        max_angle_to_furthest: 1.0
        forward_preference: true

      PreferForwardCritic:
        cost_power: 1
        cost_weight: 6.0
        threshold_to_consider: 0.5

      TwirlingCritic:
        cost_power: 1
        cost_weight: 0.3

      VelocityDeadbandCritic:
        cost_power: 1
        cost_weight: 8.0
        deadband_velocities: [0.08, 0.0, 0.12]

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 0.2
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.0
      footprint: "[[0.35, 0.18], [0.35, -0.18], [-0.35, -0.18], [-0.35, 0.18]]"
      plugins: [voxel_layer, denoise_layer, inflation_layer]

      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        footprint_clearing_enabled: true
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.20
        z_voxels: 16
        mark_threshold: 1
        observation_sources: obstacle ground
        obstacle:
          topic: /local_grid_obstacle
          min_obstacle_height: 0.10
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: PointCloud2
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          observation_persistence: 0.0
        ground:
          topic: /local_grid_ground
          min_obstacle_height: 0.0
          max_obstacle_height: 0.25
          clearing: true
          marking: false
          data_type: PointCloud2
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          observation_persistence: 0.0

      denoise_layer:
        plugin: nav2_costmap_2d::DenoiseLayer
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        cost_scaling_factor: 4.0
        inflation_radius: 0.45

      always_send_full_costmap: false
