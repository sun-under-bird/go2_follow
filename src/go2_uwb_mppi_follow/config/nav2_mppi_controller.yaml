controller_server:
  ros__parameters:
    use_sim_time: false
    verbose: false
    controller_frequency: 20.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.03
      required_movement_angle: 0.20
      movement_time_allowance: 12.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      debug_trajectory_details: false
      visualize: false
      reset_period: 1.0
      model_dt: 0.05
      time_steps: 40
      batch_size: 1000
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      vx_max: 0.4
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.0
      vx_std: 0.25
      vy_std: 0.0
      wz_std: 0.90
      retry_attempt_limit: 4
      motion_model: "DiffDrive"
      prune_distance: 3.0
      transform_tolerance: 0.2
      critics:
        [
          ConstraintCritic,
          ObstaclesCritic,
          GoalCritic,
          PathAlignCritic,
          PathFollowCritic,
          PathAngleCritic,
          PreferForwardCritic,
          TwirlingCritic,
          VelocityDeadbandCritic,
        ]

      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 4.0
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 1000000.0
        collision_margin_distance: 0.05
        near_goal_distance: 0.6
        inflation_radius: 0.4
        cost_scaling_factor: 5.0

      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      PathAlignCritic:
        enabled: false
        cost_power: 1
        cost_weight: 1.0
        max_path_occupancy_ratio: 0.05
        offset_from_furthest: 20
        trajectory_point_step: 4
        threshold_to_consider: 0.7
        use_path_orientations: false

      PathFollowCritic:
        threshold_to_consider: 1.4
        offset_from_furthest: 6
        cost_power: 1
        cost_weight: 0.7

      PathAngleCritic:
        offset_from_furthest: 4
        cost_power: 1
        cost_weight: 0.5
        threshold_to_consider: 0.7
        max_angle_to_furthest: 1.0
        forward_preference: true

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      TwirlingCritic:
        cost_power: 1
        cost_weight: 0.3

      VelocityDeadbandCritic:
        cost_power: 1
        cost_weight: 8.0
        deadband_velocities: [0.08, 0.0, 0.12]

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 15.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      transform_tolerance: 0.2
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.0
      footprint: "[[0.35, 0.18], [0.35, -0.18], [-0.35, -0.18], [-0.35, 0.18]]"
      plugins: [stvl_layer, inflation_layer]

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 1.5
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: obstacle ground
        obstacle:
          topic: /local_grid_obstacle_filtered
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_range: 3.0
          min_obstacle_height: 0.10
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: voxel
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 2.0
          min_z: 0.10
          vertical_fov_angle: 0.8745
          horizontal_fov_angle: 1.048
          decay_acceleration: 1.0
          model_type: 0
        ground:
          topic: /local_grid_ground
          data_type: PointCloud2
          marking: false
          clearing: true
          obstacle_range: 3.0
          min_obstacle_height: 0.0
          max_obstacle_height: 0.25
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: voxel
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 0.25
          min_z: 0.0
          vertical_fov_angle: 0.8745
          horizontal_fov_angle: 1.048
          decay_acceleration: 1.0
          model_type: 0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        cost_scaling_factor: 5.0
        inflation_radius: 0.4

      always_send_full_costmap: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.4, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]
    max_accel: [0.4, 0.0, 1.2]
    max_decel: [-0.5, 0.0, -1.4]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
