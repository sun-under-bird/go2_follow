disparity_node:
  ros__parameters:
    approximate_sync: false
    # 0 使用 BM：计算负载低、视差输出更快；光滑或低纹理区域的误匹配由后续过滤抑制。
    stereo_algorithm: 0
    prefilter_size: 9
    prefilter_cap: 31
    correlation_window_size: 15
    min_disparity: 0
    disparity_range: 128
    texture_threshold: 10
    speckle_size: 100
    # 收紧连通散斑视差变化，减少稳定的小片错误深度。
    speckle_range: 2
    # 启用左右视差一致性检查；0 表示关闭，1 表示最多允许 1 像素差异。
    disp12_max_diff: 1
    uniqueness_ratio: 15.0

stereo_obstacle_projector_node:
  ros__parameters:
    base_frame: base_footprint
    disparity_topic: /stereo/disparity
    camera_info_topic: /camera/camera/infra1/camera_info
    obstacle_cloud_topic: /local_grid_obstacle
    ray_observation_topic: /local_depth_observation
    diagnostics_topic: /stereo/obstacle_diagnostics
    depth_debug_topic: /stereo/depth_debug

    # 默认只生成过滤后的点云；需要核对深度时再临时打开完整深度图。
    publish_debug_depth: false
    pixel_stride: 2
    # 自由空间射线比障碍采样更稀疏，6 必须是 pixel_stride 的整数倍。
    ray_pixel_stride: 6
    min_valid_disparity_samples: 200
    max_output_points: 20000
    # 每个 5 cm 二维体素至少需要 6 个当前帧深度点支持。
    min_points_per_voxel: 6
    # 障碍簇至少包含 3 个三维 26 邻域连通体素，删除不同高度的小伪影。
    min_voxels_per_cluster: 3
    transform_timeout_sec: 0.10
    input_timeout_sec: 0.60

    depth_min: 0.20
    depth_max: 3.00
    obstacle_x_min: 0.30
    obstacle_x_max: 3.00
    obstacle_y_abs_max: 2.00
    # 高度边界在 base_footprint 下计算，0.10 m 和 0.50 m 本身保留。
    obstacle_z_min: 0.10
    obstacle_z_max: 0.50
    # 地面点不标记为障碍，但有效地面深度可作为二维自由空间射线终点。
    ray_endpoint_z_min: -0.10
    ray_endpoint_z_max: 0.50
    voxel_size: 0.05
