bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_footprint
    odom_topic: /odom_leg
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    goal_updater_topic: /goal_update
    default_nav_to_pose_bt_xml: ""
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_rate_controller_bt_node

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 3.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.4
      use_astar: true
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /odom_leg
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 2.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.35
      stateful: false

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 32
      model_dt: 0.05
      batch_size: 800
      iteration_count: 1
      vx_std: 0.2
      vy_std: 0.01
      wz_std: 0.4
      vx_max: 0.5
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.8
      ax_max: 1.0
      ax_min: -1.0
      ay_max: 1.0
      az_max: 1.5
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: DiffDrive
      visualize: false
      reset_period: 1.0
      regenerate_noises: false
      critics:
        [
          ConstraintCritic,
          CostCritic,
          GoalCritic,
          GoalAngleCritic,
          PathAlignCritic,
          PathFollowCritic,
          PathAngleCritic,
          PreferForwardCritic,
        ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        critical_cost: 300.0
        collision_cost: 1000000.0
        consider_footprint: true
        near_goal_distance: 0.8
        trajectory_point_step: 2

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.8

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.2
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 10
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 5
        threshold_to_consider: 0.5

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.2
        mode: 0

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 4
      resolution: 0.05
      footprint: "[[0.38, 0.18], [0.38, -0.18], [-0.38, -0.18], [-0.38, 0.18]]"
      plugins: [voxel_layer, inflation_layer]

      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 24
        max_obstacle_height: 1.2
        mark_threshold: 0
        observation_sources: obstacle ground
        obstacle:
          topic: /local_grid_obstacle
          data_type: PointCloud2
          marking: true
          clearing: false
          obstacle_max_range: 4.0
          obstacle_min_range: 0.05
          raytrace_max_range: 4.5
          raytrace_min_range: 0.05
          min_obstacle_height: 0.05
          max_obstacle_height: 1.2
        ground:
          topic: /local_grid_ground
          data_type: PointCloud2
          marking: false
          clearing: true
          obstacle_max_range: 4.0
          obstacle_min_range: 0.05
          raytrace_max_range: 4.5
          raytrace_min_range: 0.05
          min_obstacle_height: -0.10
          max_obstacle_height: 0.30

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.35
        cost_scaling_factor: 4.0

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 8
      height: 6
      resolution: 0.05
      footprint: "[[0.38, 0.18], [0.38, -0.18], [-0.38, -0.18], [-0.38, 0.18]]"
      track_unknown_space: false
      plugins: [voxel_layer, inflation_layer]

      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 24
        max_obstacle_height: 1.2
        mark_threshold: 0
        observation_sources: obstacle ground
        obstacle:
          topic: /local_grid_obstacle
          data_type: PointCloud2
          marking: true
          clearing: false
          obstacle_max_range: 4.0
          obstacle_min_range: 0.05
          raytrace_max_range: 4.5
          raytrace_min_range: 0.05
          min_obstacle_height: 0.05
          max_obstacle_height: 1.2
        ground:
          topic: /local_grid_ground
          data_type: PointCloud2
          marking: false
          clearing: true
          obstacle_max_range: 4.0
          obstacle_min_range: 0.05
          raytrace_max_range: 4.5
          raytrace_min_range: 0.05
          min_obstacle_height: -0.10
          max_obstacle_height: 0.30

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.35
        cost_scaling_factor: 4.0

      always_send_full_costmap: true
