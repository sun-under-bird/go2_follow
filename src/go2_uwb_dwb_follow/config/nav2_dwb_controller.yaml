controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.06
      movement_time_allowance: 5.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35
      stateful: true

    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.4
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 0.6
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -0.8
      decel_lim_y: 0.0
      decel_lim_theta: -1.8
      vx_samples: 16
      vy_samples: 1
      vtheta_samples: 32
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        [
          RotateToGoal,
          Oscillation,
          BaseObstacle,
          GoalAlign,
          GoalDist,
        ]

      BaseObstacle:
        scale: 0.08

      GoalAlign:
        scale: 18.0
        forward_point_distance: 0.20

      GoalDist:
        scale: 24.0

      RotateToGoal:
        scale: 16.0
        slowing_factor: 5.0
        lookahead_time: -1.0

      Oscillation:
        scale: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      transform_tolerance: 0.2
      rolling_window: true
      # 恢复插件只能把已观测自由区当作候选，未观测侧后方保持 unknown。
      track_unknown_space: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.0
      footprint: "[[0.35, 0.18], [0.35, -0.18], [-0.35, -0.18], [-0.35, 0.18]]"
      plugins: [voxel_layer, denoise_layer, inflation_layer]

      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        track_unknown_space: true
        footprint_clearing_enabled: true
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.20
        z_voxels: 16
        mark_threshold: 1
        observation_sources: obstacle ground
        obstacle:
          topic: /local_grid_obstacle
          min_obstacle_height: 0.10
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: PointCloud2
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          observation_persistence: 0.0
        ground:
          topic: /local_grid_ground
          min_obstacle_height: 0.0
          max_obstacle_height: 0.25
          clearing: true
          marking: false
          data_type: PointCloud2
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          observation_persistence: 0.0

      denoise_layer:
        plugin: nav2_costmap_2d::DenoiseLayer
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        cost_scaling_factor: 4.0
        inflation_radius: 0.30

      always_send_full_costmap: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [backup]

    # 标准 BackUp action 的底层实现替换为空闲区域方向脱困插件。
    backup:
      plugin: nav2_behaviors/BackUpTwzFree

    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 1.5
    robot_radius: 0.25
    max_radius: 2.0
    service_name: local_costmap/get_costmap
    free_threshold: 5
    cost_threshold: 0.0
    visualization: true
    enable_strafe: true
